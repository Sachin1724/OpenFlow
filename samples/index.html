<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenFlow · MIRA Blobatar React Sample</title>
  <link rel="stylesheet" href="bundle.css">
  <style>
    :root {
      --bg: #090a0f;
      --capsule-bg: rgba(14, 15, 19, 0.94);
      --capsule-border: rgba(255, 255, 255, 0.14);
      --capsule-rim: rgba(255, 255, 255, 0.35);
      --accent: #a5ddff;
      --text-main: #f5f5f7;
      --text-muted: #86868b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: radial-gradient(circle at 50% 15%, #181d2e 0%, var(--bg) 75%);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .title {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #ffffff 40%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-muted);
    }

    .subtitle code {
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--accent);
      font-family: Consolas, monospace;
    }

    .stage-card {
      width: 100%;
      background: rgba(20, 22, 30, 0.65);
      backdrop-filter: blur(40px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 40px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.1);
      position: relative;
    }

    .screen-notch-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: rgba(255, 255, 255, 0.06);
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
    }

    .capsule-section {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-bottom: 35px;
    }

    .openflow-capsule {
      background: var(--capsule-bg);
      border: 1px solid var(--capsule-border);
      border-radius: 24px;
      padding: 6px 18px 6px 12px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.55),
                  0 0 0 1px rgba(0, 0, 0, 0.8),
                  inset 0 1px 1px var(--capsule-rim);
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .openflow-capsule.island {
      border-top-left-radius: 4px;
      border-top-right-radius: 4px;
      border-bottom-left-radius: 22px;
      border-bottom-right-radius: 22px;
      padding: 10px 22px 10px 14px;
      margin-top: -40px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
    }

    .blobatar-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .capsule-text {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: -0.2px;
      color: #ffffff;
    }

    .dialect-badge {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      background: rgba(165, 221, 255, 0.15);
      color: var(--accent);
      border: 1px solid rgba(165, 221, 255, 0.35);
      border-radius: 6px;
      padding: 2px 7px;
    }

    .wave-bars {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 18px;
    }

    .wave-bar {
      width: 3px;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 2px;
      transition: height 0.08s ease;
    }

    .macro-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 15px 0 30px 0;
    }

    .macro-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .macro-avatar-box {
      border-radius: 50%;
      cursor: pointer;
    }

    .macro-meta {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 14px;
    }

    .macro-meta strong {
      color: var(--text-main);
    }

    .code-box {
      width: 100%;
      background: #0d0e14;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 14px 18px;
      margin-bottom: 25px;
    }

    .code-header {
      font-size: 11px;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .code-box pre {
      font-family: Consolas, "SF Mono", monospace;
      font-size: 12px;
      color: #a5ddff;
      line-height: 1.5;
      overflow-x: auto;
    }

    .controls-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 16px;
    }

    .control-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      padding: 16px;
    }

    .control-item label {
      display: block;
      font-size: 12px;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }

    button {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      flex: 1;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    button.active {
      background: var(--accent);
      color: #000000;
      border-color: var(--accent);
      font-weight: 600;
      box-shadow: 0 0 16px rgba(165, 221, 255, 0.4);
    }

    .mic-btn {
      width: 100%;
      padding: 10px;
      font-weight: 600;
    }

    .mic-btn.mic-active {
      background: #ff453a;
      color: #ffffff;
      border-color: #ff453a;
      box-shadow: 0 0 16px rgba(255, 69, 58, 0.45);
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .slider-label {
      font-size: 11px;
      color: var(--text-muted);
      display: block;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="bundle.js"></script>
</body>
</html>
