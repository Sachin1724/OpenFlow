name: Build & Release OpenFlow Windows Setup

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt
          pip install . --no-deps
          cmd /c "if not exist ..\openflow mklink /J ..\openflow ."

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress

      - name: Build OpenFlow Windows Setup Executable
        run: |
          python packaging/make_installer.py

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenFlow-Setup-exe
          path: dist/OpenFlow-Setup.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/OpenFlow-Setup.exe
          name: OpenFlow ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
